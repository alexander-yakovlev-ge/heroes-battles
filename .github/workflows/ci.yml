name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Полная проверка в Docker (§15.1)
        run: docker compose -f docker/compose.yml up --build --abort-on-container-exit --exit-code-from verify verify
      - name: Остановка окружения
        if: always()
        run: docker compose -f docker/compose.yml down -v
